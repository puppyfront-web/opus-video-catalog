<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus 5.5 视频目录</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; padding:24px; }
  /* 口令门 */
  #gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:99; }
  .gate-box { width:320px; text-align:center; }
  .gate-box h2 { font-size:17px; margin-bottom:6px; }
  .gate-box p { color:var(--dim); font-size:13px; margin-bottom:18px; }
  .gate-box input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:15px; text-align:center; letter-spacing:4px; }
  .gate-box input:focus { outline:none; border-color:var(--accent); }
  .gate-box button { width:100%; margin-top:12px; padding:10px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  .gate-err { color:#f85149; font-size:12px; margin-top:10px; min-height:16px; }
  .shake { animation:shake .3s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 75%{transform:translateX(-4px)} }
  header h1 { font-size:20px; margin-bottom:4px; }
  header p { color:var(--dim); font-size:13px; margin-bottom:16px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  .tab { padding:6px 14px; border-radius:16px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:13px; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tagbtn { padding:4px 10px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--dim); cursor:pointer; font-size:12px; }
  .tagbtn.active { color:#fff; border-color:var(--accent); background:rgba(88,166,255,.15); }
  input#q { flex:1; min-width:200px; padding:7px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .poster { aspect-ratio:16/9; background:#000; object-fit:cover; width:100%; cursor:pointer; }
  .noimg { aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; }
  .body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .title { font-size:13px; font-weight:600; line-height:1.35; min-height:2.6em; }
  .meta { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:11px; color:var(--dim); border:1px solid var(--border); border-radius:8px; padding:1px 7px; }
  .links { display:flex; gap:10px; font-size:12px; margin-top:auto; }
  .links a { color:var(--accent); text-decoration:none; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:24px; z-index:10; }
  .modal.open { display:flex; }
  .modal-box { background:var(--card); border:1px solid var(--border); border-radius:12px; max-width:720px; width:100%; max-height:85vh; overflow:auto; padding:20px; }
  .modal-box h3 { font-size:15px; margin-bottom:8px; }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; font-size:12.5px; line-height:1.5; }
  .btnrow { display:flex; gap:10px; margin-top:12px; }
  button.primary { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 16px; cursor:pointer; font-size:13px; }
  #count { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div id="gate" style="display:none">
  <div class="gate-box" id="gateBox">
    <h2>该内容受口令保护</h2>
    <p>请输入访问口令</p>
    <input id="pw" type="password" autocomplete="off" placeholder="口令">
    <button id="go">进入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>
<div id="app" style="display:none">
<header>
  <h1>Opus 5.5 爆款视频分类目录 · 共 703 条</h1>
  <p>点击海报或"查看 Prompt"展开详情，可一键复制</p>
</header>
<div class="toolbar" id="cats"></div>
<div class="toolbar">
  <input id="q" placeholder="搜索标题 / 作者 / Prompt 关键词…">
  <span id="count"></span>
</div>
<div class="toolbar" id="tags"></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
</div>

const PLAIN = null;
const CATS = {"motion":"Motion graphics 动态图形","3d":"3D scenes 三维场景","explainer":"Explainers 讲解科普","interactive":"Games & interactive 互动游戏"};
const TAGS = {"canvas":"Canvas","svg":"SVG","threejs":"Three.js","shader":"Shader","gsap":"GSAP","css":"CSS","audio":"Audio","playable":"Playable","particles":"Particles","pixel":"Pixel","webgl":"WebGL","physics":"Physics","ai-image":"AI Image"};
let DATA = null;
let state = { cat: "all", tag: "all", q: "" };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function b64ToBytes(b) {
  const bin = atob(b); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
async function tryDecrypt(pw) {
  const raw = new Uint8Array(new TextEncoder().encode(pw));
  const blob = b64ToBytes(CIPHER);
  const salt = blob.slice(0, 16), iv = blob.slice(16, 28), body = blob.slice(28);
  const baseKey = await crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 120000, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, body);
  return JSON.parse(new TextDecoder().decode(pt));
}

function renderTabs() {
  const el = document.getElementById("cats");
  const items = [["all", "全部 " + DATA.length], ...Object.keys(CATS).map(k =>
    [k, CATS[k] + " " + DATA.filter(v => v.cat === k).length])];
  el.innerHTML = items.map(([k, label]) =>
    '<button class="tab' + (state.cat === k ? " active" : "") + '" data-k="' + k + '">' + esc(label) + "</button>").join("");
  el.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.cat = b.dataset.k; renderTabs(); renderGrid(); });
}
function renderTagBtns() {
  const el = document.getElementById("tags");
  const used = [...new Set(DATA.flatMap(v => v.tags))];
  const items = [["all", "全部技术"], ...used.sort().map(t => [t, (TAGS[t] || t) + " " + DATA.filter(v => v.tags.includes(t)).length])];
  el.innerHTML = items.map(([k, label]) =>
    '<button class="tagbtn' + (state.tag === k ? " active" : "") + '" data-k="' + k + '">' + esc(label) + "</button>").join("");
  el.querySelectorAll(".tagbtn").forEach(b => b.onclick = () => { state.tag = b.dataset.k; renderTagBtns(); renderGrid(); });
}
function renderGrid() {
  const q = state.q.toLowerCase();
  const list = DATA.filter(v =>
    (state.cat === "all" || v.cat === state.cat) &&
    (state.tag === "all" || v.tags.includes(state.tag)) &&
    (!q || (v.title + " " + v.author + " " + v.prompt).toLowerCase().includes(q)));
  document.getElementById("count").textContent = list.length + " 条";
  document.getElementById("grid").innerHTML = list.map((v, i) =>
    '<div class="card">' +
      (v.poster ? '<img class="poster" loading="lazy" src="' + esc(v.poster) + '" data-i="' + i + '">'
                : '<div class="noimg" data-i="' + i + '">无预览图</div>') +
      '<div class="body">' +
        '<div class="title">' + esc(v.title) + "</div>" +
        '<div class="meta">' + v.tags.map(t => '<span class="chip">' + esc(TAGS[t] || t) + "</span>").join("") + "</div>" +
        '<div class="links"><a href="#" data-i="' + i + '">查看 Prompt</a>' +
          (v.post ? '<a href="' + esc(v.post) + '" target="_blank">原帖</a>' : "") +
          (v.skillry ? '<a href="' + esc(v.skillry) + '" target="_blank">Skillry复刻</a>' : "") + "</div>" +
      "</div></div>").join("");
  document.querySelectorAll("[data-i]").forEach(el => el.onclick = () => openModal(list[+el.dataset.i]));
}
function openModal(v) {
  const box = document.getElementById("modalBox");
  box.innerHTML = "<h3>" + esc(v.title) + "</h3>" +
    '<div class="meta" style="margin-bottom:10px">' +
      '<span class="chip">' + esc(CATS[v.cat]) + "</span>" +
      v.tags.map(t => '<span class="chip">' + esc(TAGS[t] || t) + "</span>").join("") + "</div>" +
    "<pre>" + esc(v.prompt) + (v.partial ? "\n\n(部分 Prompt)" : "") + "</pre>" +
    '<div class="btnrow"><button class="primary" id="copyBtn">复制 Prompt</button>' +
      (v.post ? '<a href="' + esc(v.post) + '" target="_blank" style="align-self:center;font-size:13px">原帖 ↗</a>' : "") + "</div>";
  document.getElementById("modal").classList.add("open");
  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(v.prompt).then(() => {
      document.getElementById("copyBtn").textContent = "已复制 ✓";
    });
  };
}
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") e.target.classList.remove("open"); };
document.getElementById("q").oninput = e => { state.q = e.target.value; renderGrid(); };

function startApp(data) {
  DATA = data;
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  renderTabs(); renderTagBtns(); renderGrid();
}

async function unlock(pw) {
  const err = document.getElementById("gateErr");
  err.textContent = "";
  try {
    const data = CIPHER ? await tryDecrypt(pw) : JSON.parse(PLAIN);
    sessionStorage.setItem("opus-pass", pw);
    startApp(data);
  } catch (e) {
    err.textContent = "口令不正确，请重试";
    const box = document.getElementById("gateBox");
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  }
}

if (CIPHER) {
  document.getElementById("gate").style.display = "flex";
  document.getElementById("go").onclick = () => unlock(document.getElementById("pw").value);
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") unlock(e.target.value); };
  const saved = sessionStorage.getItem("opus-pass");
  if (saved) unlock(saved);
} else {
  startApp(JSON.parse(PLAIN));
}
</script>
